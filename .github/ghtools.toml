# ghtools settings: https://github.com/will-roscoe/.ghtools#configuration

branch = "main"                              # the remote's default branch
profile = "hacs"                             # custom_components/*/manifest.json + hacs.json

[version]
source = "manifest"                          # custom_components/ios2ha_camera/manifest.json (HACS integration)
bump = "write"                               # ghtools computes the version from commits and writes it
manifest = "custom_components/ios2ha_camera/manifest.json" # HACS manifest

[release]
publish = ["github-zip"]                     # zip step in release workflow
zip = "custom_components/ios2ha_camera"      # zip step in release workflow
changelog = ""                               # no CHANGELOG.md

[ci]
python = ["3.14"]                            # python-version in workflows
install = "-r requirements_test.txt ruff"    # pip install in test workflow
gates = ["ruff", "ruff-format"]              # tool configuration and existing workflows

[status]
enabled = true                               # ghtools publishes the status card to its own branch
logo = "custom_components/ios2ha_camera/brand/icon.png"  # the card shows the project logo

[[readme.block]]
name = "status"
kind = "status"                              # the status card under the title
